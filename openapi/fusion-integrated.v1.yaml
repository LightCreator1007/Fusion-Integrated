openapi: 3.0.3
info:
  title: Fusion-Integrated API
  version: 1.0.0
  description: Non-academic platform. Independent modules, one login.
paths:
  /api/v1/auth/login:
    post:
      operationId: v1_auth_login_create
      description: Sets the httpOnly session cookie. The token itself is never returned
        in the body.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      security:
      - iamSession: []
